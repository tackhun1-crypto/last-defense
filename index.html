    gain.gain.setValueAtTime(volume,t);

function loadCheckpoint(){

    if(!data||typeof data.hardMode!=="boolean"||!Number.isSafeInteger(data.wave)||data.wave<1||
      ![data.hp,data.playerHp].every(value=>Number.isInteger(value)&&value>0&&value<=100)||
      ![data.coins,data.kills].every(value=>Number.isSafeInteger(value)&&value>=0)||
      !Array.isArray(data.owned)||!data.owned.includes(0)||!data.owned.includes(data.weaponIndex)||
      !data.owned.every(index=>Number.isInteger(index)&&index>=0&&index<weapons.length)||
      !Array.isArray(data.upgrades)||data.upgrades.length!==weapons.length||

function loadActorAtlas(url,frames,playerArt=false,columns=2){
  const img=document.createElement('img');
  img.onload=()=>{
    const atlas=new THREE.Texture(img);
    atlas.colorSpace=THREE.SRGBColorSpace;
    atlas.generateMipmaps=playerArt;
    atlas.minFilter=playerArt?THREE.LinearMipmapLinearFilter:THREE.LinearFilter;
    // The square player cells reserve transparent gutters around every silhouette.
    atlas.userData.aspect=playerArt?1:320/384;
    const rows=frames.length/columns;
    frames.forEach((key,i)=>{
      const frame=i===0?atlas:atlas.clone();
      frame.repeat.set(1/columns,1/rows);
      frame.offset.set((i%columns)/columns,1-(Math.floor(i/columns)+1)/rows);
      frame.needsUpdate=true;
      actorFrames[key]=frame;
    });
  };
  img.src=url;
  return img;
}

function updateIllustratedActors(lateralVelocity,dt=0){
  actorScreenUp.setFromMatrixColumn(camera.matrixWorld,1);
  const speed=playing?Math.abs(lateralVelocity):0;
  heroStride=(heroStride+Math.min(speed,13)*dt*4.1)%(Math.PI*2);
  heroGaitWeight=THREE.MathUtils.damp(heroGaitWeight,Math.min(1,speed*.45),18,dt);
  const female=avatar==='female';
  const actor=female?'hero':'male';
  let action='ready';
  if(playing){
    if(speed>.48)action=heroStride<Math.PI?'step-a':'step-b';
    else if(muzzleTime>0)action='fire';
  }
  const equipped=outfit==='standard'?actor:actor+'-'+outfit;
  const ready=equipped+'-ready';
  const normalPose=equipped+'-'+action;
  const reaction=flinch>.28?'hit':deploy>.18?'deploy':swap>.22?'swap':brace>.38&&speed<.48?'brace':null;
  const reactionPose=playing&&reaction?equipped+'-'+reaction:null;
  const fallbackReaction=playing&&reaction&&!actorFrames[ready]?actor+'-'+reaction:null;
  const pose=[reactionPose,normalPose,ready,fallbackReaction,actor+'-'+action,actor+'-ready',female?'hero-ready':'male']
    .find(key=>key&&actorFrames[key]);
  const activeReaction=pose&&(pose===reactionPose||pose===fallbackReaction)?reaction:null;
  const heroFrame=actorFrames[pose];
  heroSprite.visible=Boolean(heroFrame);
  if(heroFrame){
    const scale=activeReaction==='deploy'?.77:activeReaction==='brace'?.93:1;
    heroPoseHeight=THREE.MathUtils.damp(heroPoseHeight,scale,24,dt);
    const scaleAtEdges=1-.045*Math.pow(Math.min(1,Math.abs(player.position.x)/5.4),2);
    applyPaintedFrame(heroSprite,heroFrame,(female?3.31:3.48)*heroPoseHeight*scaleAtEdges);
    heroSprite.position.copy(player.position);
    const strideLift=activeReaction?0:heroGaitWeight*Math.abs(Math.sin(heroStride))*.046;
    const breathing=activeReaction||speed>.48?0:Math.sin(elapsed*2.5)*.013;
    heroSprite.position.y=.09+strideLift+breathing;
    const reactionLean=activeReaction==='hit'?flinch*.075:activeReaction==='swap'?-swap*.049:0;
    heroSprite.material.rotation=-Math.min(.05,recoil*.9)+heroGaitWeight*Math.sin(heroStride)*.024+reactionLean;
    heroSprite.material.color.setHex(flinch>.55?0xffd1c6:0xffffff);
    if(muzzleTime>0&&(!activeReaction||activeReaction==='brace')){
      const shotLight=muzzleTime/.075;
      heroSprite.material.color.r+=shotLight*.13;
      heroSprite.material.color.g+=shotLight*.07;
    }
    survivor.visible=maleSurvivor.visible=false;
    if(femaleGlb)femaleGlb.visible=false;
  }else{
    survivor.visible=female&&!femaleGlb;
    maleSurvivor.visible=!female;
    if(femaleGlb)femaleGlb.visible=female;
  }
  gun.visible=!heroFrame;
  for(const hand of weaponHands)hand.visible=!heroFrame;
  const aimPose=Boolean(heroFrame)&&(!activeReaction||activeReaction==='brace');
  const appearance=weaponAppearance[weaponIndex];
  paintedWeapon.visible=aimPose&&Boolean(appearance);
  paintedMuzzle.visible=aimPose&&playing&&muzzleTime>0;
  if(paintedWeapon.visible||paintedMuzzle.visible){
    const [mx,my]=muzzleAnchors[pose]??muzzleAnchors['hero-ready'];
    actorScreenRight.setFromMatrixColumn(camera.matrixWorld,0);
    const dx=(mx-heroSprite.center.x)*heroSprite.scale.x,dy=(my-heroSprite.center.y)*heroSprite.scale.y;
    const angle=heroSprite.material.rotation;
    originalMuzzle.copy(heroSprite.position)
      .addScaledVector(actorScreenRight,dx*Math.cos(angle)-dy*Math.sin(angle))
      .addScaledVector(actorScreenUp,dx*Math.sin(angle)+dy*Math.cos(angle));
    const barrelAngle=angle+(pose.endsWith('-fire')?.18:.10);
    if(paintedWeapon.visible){
      if(paintedWeapon.material.map!==appearance.art){
        paintedWeapon.material.map=appearance.art;
        paintedWeapon.material.needsUpdate=true;
      }
      paintedWeapon.center.set(appearance.origin,.50);
      viewTowardCamera.setFromMatrixColumn(camera.matrixWorld,2);
      paintedWeapon.position.copy(originalMuzzle).addScaledVector(viewTowardCamera,.026);
      paintedWeapon.scale.set(appearance.width,appearance.height,1);
      paintedWeapon.material.rotation=barrelAngle;
    }
    if(paintedMuzzle.visible){
      paintedMuzzle.position.copy(originalMuzzle);
      if(appearance){
        const reach=(appearance.tip-appearance.origin)*appearance.width;
        paintedMuzzle.position.addScaledVector(actorScreenRight,Math.cos(barrelAngle)*reach)
          .addScaledVector(actorScreenUp,Math.sin(barrelAngle)*reach);
      }
      const brightness=muzzleTime/.075;
      const [flashWidth,flashHeight]=appearance?.flash??[.64,.56];
      paintedMuzzle.material.opacity=Math.min(.98,brightness*1.3);
      paintedMuzzle.material.color.setHex(weapons[weaponIndex].color);
      paintedMuzzle.material.rotation=barrelAngle;
      paintedMuzzle.scale.set(flashWidth*(.63+brightness*.37),flashHeight*(.63+brightness*.37),1);
    }
  }
  for(const enemy of enemies)drawIllustratedEnemy(enemy,false);
  for(const enemy of remains)if(enemy.userData.artSprite)drawIllustratedEnemy(enemy,true);
}

function drawIllustratedEnemy(enemy,fallen){
  const data=enemy.userData;
  let pose=data.illustration;
  if(!fallen&&pose==='infected')pose='infected-walk-'+(Math.floor((data.walkDistance??0)*3.2)%4);
  if(!fallen&&pose==='chief'){
    if(data.stun>0)pose='chief-stagger';
    else if(data.windup>0)pose='chief-windup';
    else if(data.dash>0)pose=Math.floor((data.walkDistance??0)*2)%2?'chief-charge-a':'chief-charge-b';
  }
  const frame=actorFrames[pose]??actorFrames[data.illustration];
  if(!frame)return;
  if(!data.artSprite){
    data.artSprite=newPaintedActor();
    for(const mesh of enemy.children)if(mesh!==data.label)mesh.visible=false;
  }
  const sprite=data.artSprite;
  const stride=(data.walkDistance??enemy.position.z)*4.8+data.phase;
  const bossMotion=data.windup>0?.84:data.dash>0?1.025:1;
  applyPaintedFrame(sprite,frame,data.artHeight*bossMotion);
  sprite.position.copy(enemy.position);
  sprite.position.y+=fallen?.34:.06+Math.abs(Math.sin(stride))*.042;
  sprite.center.set(.5,fallen?.5:.04);
  sprite.material.rotation=fallen?-1.49:Math.sin(stride)*.047+(data.dash>0?.09:0);
  sprite.material.color.setHex(fallen?0x957e79:data.flashTime>0?0xffc0a7:0xf6f0ed);
  if(!fallen&&data.big&&data.label){
    // Sprite height is screen-aligned, so project the label from the same anchor.
    healthLabelWorld.copy(sprite.position)
      .addScaledVector(actorScreenUp,sprite.scale.y*.94+.36);
    data.label.position.copy(enemy.worldToLocal(healthLabelWorld));
    data.label.scale.set(1.55/enemy.scale.x,.78/enemy.scale.y,1);
  }
}
