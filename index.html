const enemies=[],bullets=[],particles=[];let hp=100,wave=1,coins=0,kills=0,level=1,damage=18,fireRate=.3,lastShot=0,spawned=0,toSpawn=0,spawnTimer=0,playing=false,intermission=false,elapsed=0,dragging=false,targetX=0;const clock=new THREE.Clock();const labelCanvas=document.createElement('canvas');function textSprite(t){const c=document.createElement('canvas');c.width=256;c.height=128;const ctx=c.getContext('2d');ctx.font='bold 74px system-ui';ctx.textAlign='center';ctx.lineWidth=12;ctx.strokeStyle='#8b2730';ctx.strokeText(String(t),128,85);ctx.fillStyle='white';ctx.fillText(String(t),128,85);const tex=new THREE.CanvasTexture(c);const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));spr.scale.set(1.5,.75,1);return spr}function makeEnemy(){const big=wave%5===0&&spawned===toSpawn-1;const e=new THREE.Group();e.position.set((Math.random()-.5)*10.5,0,-52-Math.random()*10);const body=big?1.7:1;const zombieSkin=mat(big?0x9b8eac:0x83a58c);sphere(.42*body,zombieSkin,0,2.2*body,0,e);box(.85*body,1.05*body,.6*body,mat(big?0x783b5e:0x76635e),0,1.5*body,0,e);for(const s of [-1,1]){box(.25*body,.9*body,.3*body,zombieSkin,s*.62*body,1.5*body,-.12,e);box(.28*body,.8*body,.32*body,dark,s*.22*body,.58*body,0,e)}const eyes=mat(0xf5e09a,{emissive:0xe4a330,emissiveIntensity:1});sphere(.07*body,eyes,-.16*body,2.25*body,-.36*body,e);sphere(.07*body,eyes,.16*body,2.25*body,-.36*body,e);e.scale.setScalar(big?1.35:1);e.userData={hp:big?180+wave*22:40+wave*10,maxHp:big?180+wave*22:40+wave*10,speed:(big?1.7:2.5)+wave*.18,attack:big?25:10,big,phase:Math.random()*7};e.userData.label=textSprite(e.userData.hp);e.userData.label.position.set(0,big?4.7:3.15,0);e.add(e.userData.label);scene.add(e);enemies.push(e)}function updateLabel(e){e.remove(e.userData.label);e.userData.label.material.map.dispose();e.userData.label.material.dispose();e.userData.label=textSprite(Math.max(0,Math.ceil(e.userData.hp)));e.userData.label.position.set(0,e.userData.big?4.7:3.15,0); function beginWave(){intermission=false;spawned=0;toSpawn=5+wave*3;spawnTimer=.6;$('wave').textContent=wave;playing=true;$('panel').style.display='none'}function updateHUD(){$('hptext').textContent=`${Math.max(0,hp)} / 100`;$('healthFill').style.width=hp+'%';$('coins').textContent=coins;$('kills').textContent=kills;$('level').textContent=level}function showPanel(title,desc,buttons){playing=false;$('title').textContent=title;$('description').innerHTML=desc;$('choices').innerHTML='';buttons.forEach(({text,action,secondary})=>{const b=document.createElement('button');b.textContent=text;if(secondary)b.className='secondary';b.onclick=action;$('choices').appendChild(b)});$('panel').style.display='flex'}function nextShop(){intermission=true;coins+=20+wave*5;updateHUD();showPanel('🏆 웨이브 '+wave+' 완료!',`보너스 골드 획득!<br>보유 골드: <b>${coins}</b><br>다음 웨이브를 준비하세요.`,[{text:`🔫 공격력 강화 (${25+level*10}G)`,action:()=>{const cost=25+level*10;if(coins>=cost){coins-=cost;level++;damage+=12;updateHUD();nextShopNoBonus()}},secondary:true},{text:'⚡ 연사속도 강화 (40G)',action:()=>{if(coins>=40){coins-=40;fireRate=Math.max(.105,fireRate*.82);updateHUD();nextShopNoBonus()}},secondary:true},{text:'🛡️ 기지 수리 (30G)',action:()=>{if(coins>=30){coins-=30;hp=Math.min(100,hp+35);updateHUD();nextShopNoBonus()}},secondary:true},{text:'다음 웨이브 ▶',action:()=>{wave++;beginWave()}}])}function nextShopNoBonus(){showPanel('🛠️ 업그레이드 완료',`남은 골드: <b>${coins}</b><br>전투를 계속할 준비가 됐습니다.`,[{text:'다음 웨이브 ▶',action:()=>{wave++;beginWave()}}])}function reset(){enemies.slice().forEach(removeEnemy);bullets.forEach(b=>scene.remove(b));bullets.length=0;particles.forEach(p=>scene.remove(p));particles.length=0;hp=100;wave=1;coins=0;kills=0;level=1;damage=18;fireRate=.3;lastShot=0;targetX=0;player.position.x=0;updateHUD();beginWave()}$('start').onclick=reset;function pointer(e){const x=(e.clientX/innerWidth)*2-1;targetX=THREE.MathUtils.clamp(x*6,-5.4,5.4)}renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;pointer(e)});w
